version: 2

project_name: cumasach

before:
  hooks:
    - go mod tidy

builds:
  - id: cumasach
    main: ./cmd/cumasach
    binary: cumasach
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "cumasach_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^Merge"
  groups:
    - title: Features
      regexp: "^.*feat.*$"
      order: 0
    - title: Bug Fixes
      regexp: "^.*fix.*$"
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: project-cumasach
  draft: false
  prerelease: auto

homebrew_casks:
  - name: cumasach
    # repository.name is required for GoReleaser to render the cask, even with
    # skip_upload. No token here: skip_upload means GoReleaser never pushes;
    # the cask is published by the signed-commit step in release.yml.
    repository:
      owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
      name: homebrew-tap
    homepage: "https://github.com/artur-ciocanu/project-cumasach"
    description: "OCI-native packaging for Agent Skills"
    directory: Casks
    # Generate the cask into dist/ only. Publishing is handled by a separate
    # signed-commit step in release.yml, because the tap requires signed
    # commits and GoReleaser's API push produces unsigned commits.
    skip_upload: true
    # Binaries are not notarized; strip the Gatekeeper quarantine attribute
    # on install so macOS will run them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cumasach"]
          end
